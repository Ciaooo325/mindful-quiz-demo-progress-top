<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dce8ef" />
  <title>冥知故問｜心境探索</title>
  <link rel="stylesheet" href="style.css" />
  <script src="baseline-recommendation.js" defer></script>
  <script src="script.js" defer></script>
  
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#91b9da">
</head>
<body>
  <main class="quiz" id="quiz" aria-label="Initial 心境問卷">
    <!-- 背景圖片：由 JavaScript 隨選項更新 -->
    <div class="background background--base" id="backgroundBase" aria-hidden="true"></div>
    <div class="background background--overlay" id="backgroundOverlay" aria-hidden="true"></div>
    <div class="background-tint" aria-hidden="true"></div>

    <section class="quiz-content" id="quizContent">
        <div class="progress" aria-label="測驗進度">
          <span id="progressText">1 / 3</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      <header class="question-header">
        <div class="question-badge" id="questionBadge">Q1</div>
        <h1 id="questionTitle">最近的你，心情像哪一座森林？</h1>
        <p class="question-hint">點選一個景象，看看它是否貼近你的感受。</p>
      </header>

      <div class="visual-space" aria-hidden="true"></div>

      <section class="options" id="options" aria-label="請選擇一個選項"></section>

      <footer class="quiz-footer">
        <div class="navigation">
          <button class="back-button" id="backButton" type="button"><span aria-hidden="true">❮</span> 上一題 </button>
          <button class="next-button" id="nextButton" type="button" disabled> 下一題 <span aria-hidden="true">❯</span></button>
        </div>
      </footer>
    </section>

    <section class="result" id="result" hidden>
      <div class="result-panel">
        <p class="result-eyebrow">INITIAL · COMPLETE</p>
        <h2>謝謝你，完成了心境探索</h2>
        <p>
        根據你的心境探索結果，
        為你推薦適合的冥想場景、呼吸方式與引導技巧。
        </p>
        <div id="answerSummary" class="answer-summary"></div>
        <button class="next-button" id="restartButton" type="button">重新測驗</button>
      </div>
    </section>
  </main>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", async () => {
    const status = document.createElement("div");
    status.textContent = "正在準備離線資料，請保持連線…";
    status.style.cssText =
      "position:fixed;bottom:12px;left:12px;right:12px;" +
      "padding:12px;background:#fff;color:#234;border-radius:10px;" +
      "box-shadow:0 2px 12px #0003;z-index:99999;text-align:center;";
    document.body.appendChild(status);

    try {
      const registration = await navigator.serviceWorker.register("./sw.js");

      if (registration.waiting) {
        status.textContent = "新版離線資料已備妥，請關閉所有網站視窗後重開。";
        return;
      }

      if (registration.installing) {
        await new Promise((resolve, reject) => {
          const worker = registration.installing;

          const check = () => {
            if (worker.state === "installed" ||
                worker.state === "activated") resolve();
            if (worker.state === "redundant") {
              reject(new Error("離線資料下載失敗"));
            }
          };

          worker.addEventListener("statechange", check);
          check();
        });
      }

      if (registration.waiting) {
        status.textContent = "新版離線資料已備妥，請關閉所有網站視窗後重開。";
        return;
      }

      await navigator.serviceWorker.ready;
      status.textContent = "離線資料已準備完成，可以斷網使用。";
      setTimeout(() => status.remove(), 5000);
    } catch (error) {
      console.error(error);
      status.textContent =
  "離線準備失敗：" + error.name + " — " + error.message;
    }
    
  });
}
</script>
</body>
</html>
