
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>夢幻冥想音樂播放器</title>

  
    <link rel="stylesheet" href="music_page.css">
    
    <script src="music_page.js" defer></script>



</head>

<body>

  <div class="background" id="background"></div>

  <main class="app">

    <div class="top-bar">
      <button class="back-btn" onclick="history.back()" aria-label="返回">
        &#8249;
      </button>
    </div>

    <section class="player">

      <!-- CD 封面 -->
      <div class="cd-area">
        <div class="cd-glow"></div>

        <div class="cd" id="cd">
          <div class="cd-center"></div>
        </div>

        <span class="sparkle one"></span>
        <span class="sparkle two"></span>
        <span class="sparkle three"></span>
      </div>

      <!-- 音樂資訊 -->
      <h1 class="music-title" id="musicTitle">
        海浪輕拍
      </h1>

      <p class="music-description" id="musicDescription">
        自然海浪聲，結合輕柔旋律
      </p>

      <div class="tags" id="musicTags"></div>

      <!-- 音樂進度 -->
      <div class="progress-container">

        <span class="time" id="currentTime">00:00</span>

        <input
          id="progress"
          class="progress"
          type="range"
          min="0"
          max="100"
          value="0"
          aria-label="音樂播放進度"
        >

        <span class="time" id="duration">00:00</span>
      </div>

      <!-- 播放器操作 -->
      
<!-- ===== 播放器操作 ===== -->
<div class="controls">

  <!-- 播放／暫停 -->
  <button
    class="play-btn"
    id="playBtn"
    type="button"
    aria-label="播放"
  >
    <svg id="playIcon" viewBox="0 0 24 24">
      <path d="M8 5v14l11-7z"/>
    </svg>
  </button>

  <!-- 靜音 -->
  <button
    class="control-btn mute-btn"
    id="muteBtn"
    type="button"
    aria-label="靜音"
  >
    <svg id="volumeIcon" viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 4V5L7 9H3zm12.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 15.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/>
    </svg>
  </button>

</div>

    </section>
  </main>

  <audio id="audio" preload="metadata"></audio>


</body>
</html>
